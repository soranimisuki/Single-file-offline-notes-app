name: Build IPA (unsigned)

# 在 GitHub 的 macOS 云主机上构建 iOS 应用，产出**未签名 IPA**。
# 签名/侧载由使用者自己完成（Sideloadly / AltStore / Xcode / 爱思等）。
on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'ios/**'
      - '.github/workflows/ios-ipa.yml'

permissions:
  contents: write        # 需要写 Release 权限来挂 IPA 附件

concurrency:
  group: ios-ipa
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: 环境信息（选最新可用 Xcode）
        run: |
          for v in 16.4 16.3 16.2 16.1 16.0 15.4; do
            if [ -d "/Applications/Xcode_$v.app" ]; then
              sudo xcode-select -s "/Applications/Xcode_$v.app"
              echo "selected Xcode $v"
              break
            fi
          done
          xcodebuild -version
          swift --version

      - name: 安装 xcodegen
        run: brew install xcodegen

      - name: 准备 Web 资源（页面 + 本地 MathJax）
        run: |
          set -euo pipefail
          rm -rf ios/Web
          mkdir -p ios/Web/_mathjax
          python3 - <<'PY'
          src = open('index.html', encoding='utf-8').read()
          cdn = 'https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-svg.js'
          assert cdn in src, 'index.html 里没找到 MathJax CDN 地址'
          open('ios/Web/index.html', 'w', encoding='utf-8').write(src.replace(cdn, '_mathjax/tex-svg.js'))
          print('index.html ok: CDN -> _mathjax/tex-svg.js')
          PY
          TGZ=mathjax-3.2.2.tgz
          curl -sSL -o "$TGZ" https://registry.npmjs.org/mathjax/-/mathjax-3.2.2.tgz
          tar -xzf "$TGZ"
          cp package/es5/tex-svg.js ios/Web/_mathjax/
          cp -R package/es5/input ios/Web/_mathjax/input
          mkdir -p ios/Web/_mathjax/output
          [ -d package/es5/output/svg ] && cp -R package/es5/output/svg ios/Web/_mathjax/output/svg
          rm -rf package "$TGZ"
          du -sh ios/Web
          ls ios/Web
          test -f ios/Web/_mathjax/tex-svg.js
          test -f ios/Web/_mathjax/input/tex/extensions/boldsymbol.js

      - name: 生成 Xcode 工程
        run: |
          cd ios
          xcodegen generate
          ls Biji.xcodeproj

      - name: 编译（真机 arm64，不签名）
        run: |
          cd ios
          set -o pipefail
          xcodebuild -project Biji.xcodeproj -scheme Biji \
            -configuration Release -sdk iphoneos \
            -derivedDataPath build \
            ONLY_ACTIVE_ARCH=NO ARCHS=arm64 \
            build 2>&1 | tee /tmp/xcodebuild.log
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "APP=$APP"
          test -n "$APP"
          echo "==== Info.plist 关键字段 ===="
          plutil -p "$APP/Info.plist" | grep -E "CFBundleIdentifier|CFBundleExecutable|CFBundleShortVersion|CFBundleVersion|MinimumOSVersion|UIDeviceFamily|UILaunch|UIFileSharing|NSAppTransport" -A3 || true
          echo "==== 包内资源 ===="
          ls "$APP" && ls "$APP/Web" | head -5
          rm -rf "$RUNNER_TEMP/ipa"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          ls -la "$RUNNER_TEMP/ipa/Payload/"

      - name: 打成未签名 IPA
        run: |
          cd "$RUNNER_TEMP/ipa"
          zip -qry "$GITHUB_WORKSPACE/biji-unsigned.ipa" Payload
          cd "$GITHUB_WORKSPACE"
          ls -lh biji-unsigned.ipa
          unzip -l biji-unsigned.ipa | head -15
          unzip -l biji-unsigned.ipa | grep -c "_mathjax" || true

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: biji-unsigned-ipa
          path: biji-unsigned.ipa
          if-no-files-found: error

      - name: 发布到 Releases（免登录直链）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=v1.0-ipa
          NOTES='未签名 IPA（iOS 14+，iPhone/iPad 通用）。

          安装：下载后用 Sideloadly / AltStore / 爱思 导入，填自己的 Apple ID 签名。
          bundle id: com.soranimisuki.biji

          这是 GitHub Actions 自动构建的产物，每次推送 index.html 或 ios/ 会自动更新。'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" biji-unsigned.ipa --clobber
          else
            gh release create "$TAG" biji-unsigned.ipa --title '笔记站 iOS（未签名 IPA）' --notes "$NOTES"
          fi
          echo "下载地址："
          gh release view "$TAG" --json assets -q '.assets[].browser_download_url'

      - name: 失败时打印错误
        if: failure()
        run: |
          echo "==== 编译错误 ===="
          grep -E "error:|error " /tmp/xcodebuild.log | head -40 || true
          echo "==== 末尾日志 ===="
          tail -40 /tmp/xcodebuild.log || true
