name: Biji

options:
  bundleIdPrefix: com.soranimisuki
  # 关键：xcodegen 2.46 默认生成 Xcode 16 工程格式(77)，Xcode 15.4 打不开
  #（报 "future Xcode project file format (77)"）。锁到 15.x 格式。
  xcodeVersion: "15.4"
  deploymentTarget:
    iOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    DEVELOPMENT_TEAM: ""
    ENABLE_BITCODE: "NO"
    TARGETED_DEVICE_FAMILY: "1,2"          # iPhone + iPad
    SWIFT_TREAT_WARNINGS_AS_ERRORS: "NO"
    ALWAYS_SEARCH_USER_PATHS: "NO"

targets:
  Biji:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
      - path: Web                            # CI 生成：index.html + _mathjax/
        type: folder
        buildPhase: resources
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: 笔记站
        CFBundleName: Biji
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIFileSharingEnabled: true            # 备份 JSON 能在「文件」App 里看到
        LSSupportsOpeningDocumentsInPlace: true
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true      # 允许加载 http://127.0.0.1 的内置页面
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.soranimisuki.biji
        PRODUCT_NAME: Biji
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: "YES"
